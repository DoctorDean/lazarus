name: despasito_saft_gamma_mie_propane_saturation
repo_url: https://github.com/Santiso-Group/despasito
base_image: lazarus/despasito:propane-sat-working
entrypoint: '#!/usr/bin/env bash

  set -euo pipefail

  source activate despasito

  EXDIR=/root/repo/despasito/examples/saft_gamma_mie/pure_component


  # Use the caller-provided input JSON if given, otherwise the shipped propane example.

  INPUT_PATH="${INPUT:-$EXDIR/input_propane_sat.json}"

  cp "$INPUT_PATH" "$EXDIR/lazarus_input.json"


  # despasito resolves EOSgroup ("../../library/SAFTgroup.json") and writes its

  # output_file relative to the current working directory, so run inside the example
  dir.

  cd "$EXDIR"

  python -m despasito -i lazarus_input.json


  mkdir -p "$OUTDIR"

  # Copy every saturation output table produced by the run.

  cp "$EXDIR"/out_*.txt "$OUTDIR"/ 2>/dev/null || true

  cp "$EXDIR"/propane_saturation_exp.dat "$OUTDIR"/ 2>/dev/null || true

  echo "Outputs written to $OUTDIR"

  ls -la "$OUTDIR"'
inputs:
- name: INPUT
  type: file
  description: DESPASITO JSON input (calculation_type=saturation_properties). Defaults
    to the shipped input_propane_sat.json describing propane as 2xCH3+1xCH2 SAFT-gamma
    Mie beads over a 100-350 K grid.
outputs:
- name: out_propane_saturation.txt
  type: file
  description: 'Table: T[K], Psat[Pa], rhol[mol/m^3], rhov[mol/m^3] for each temperature
    in Tlist.'
smoke:
  description: Run the propane SAFT-gamma Mie saturation calculation and compare computed
    vapor pressures to the shipped experimental curve; passes if AARD < 0.15 and all
    non-trivial points are finite.
  command: source activate despasito && cd /root/repo/despasito/examples/saft_gamma_mie/pure_component
    && python lazarus_smoke.py
  metric: aard_vapor_pressure
  threshold: 0.15
  input_ref: despasito/examples/saft_gamma_mie/pure_component/input_propane_sat.json
benchmark:
  description: Average absolute relative deviation of SAFT-gamma Mie computed saturation
    pressure vs shipped experimental propane_saturation_exp.dat over the 9 non-trivial
    temperatures (150-350 K, P_exp>=1e-4 MPa).
  metric: AARD(Psat)
  reported: 0
  tolerance: 0.15
  n: 9
  source: despasito/examples/saft_gamma_mie/pure_component/propane_saturation_exp.dat
  command: ''
  measured: 0.032578
paper: ''
commit: b54781980e38bc16f82706ab30a29c51ed67c468
patches:
- Created despasito/_version.py (versioningit write-file was skipped under --no-build-isolation)
  with __version__='1.0.0' so `import despasito` succeeds.
- 'Added density_opts={pressure_min: 1e-4} to input_propane_sat.json so the low-temperature
  125 K point (Psat~8 Pa, below the default 100 Pa pressure floor) resolves to a finite
  Psat/rhol/rhov; the 100 K near-zero point (exp rhov=0) remains numerically unresolvable
  and is the point the sanity spec skips. Higher-T points and the AARD are unchanged.'
- Added lazarus_smoke.py smoke-check script to the example dir.
platform: linux/amd64
gpus: ''
